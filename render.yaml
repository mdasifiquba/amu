services:
  - type: web
    name: amu-class-6-results-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amu-class-6-results
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: amu-class-6-results
    databaseName: amu_class6_results
    user: amu_class6_admin
    plan: free
