    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    async function apiRequest(url, options = {}) {
      if (!supabaseClient) {
        throw new Error('Supabase config missing hai. supabase-config.js mein Project URL aur anon key set karein.');
      }

      const method = options.method || 'GET';
      const body = options.body ? JSON.parse(options.body) : {};

      if (url === '/api/admin/login' && method === 'POST') {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: body.email,
          password: body.password,
        });
        if (error) throw error;
        if (data.user?.app_metadata?.role !== 'admin') {
          await supabaseClient.auth.signOut();
          throw new Error('Is Supabase account ko admin access nahi diya gaya.');
        }
        return { token: data.session.access_token };
      }

      if (url === '/api/admin/submissions' && method === 'GET') {
        const { data, error } = await supabaseClient
          .from('submissions').select('record').order('created_at', { ascending: false });
        if (error) throw error;
        return { submissions: data.map(row => row.record) };
      }

      if (url === '/api/admin/migrate' && method === 'POST') {
        const rows = (body.submissions || []).map(record => ({ id: record.id, record }));
        if (!rows.length) return { imported: 0 };
        const { error } = await supabaseClient.from('submissions').upsert(rows, {
          onConflict: 'id', ignoreDuplicates: true,
        });
        if (error) throw error;
        return { imported: rows.length };
      }

      const deleteMatch = url.match(/^\/api\/admin\/submissions\/([^/]+)$/);
      if (deleteMatch && method === 'DELETE') {
        const { error } = await supabaseClient.from('submissions').delete().eq('id', decodeURIComponent(deleteMatch[1]));
        if (error) throw error;
        return { ok: true };
      }

      if (url === '/api/submissions' && method === 'POST') {
        const submission = { ...body, id: crypto.randomUUID() };
        const { error } = await supabaseClient
          .from('submissions').insert({ id: submission.id, record: submission });
        if (error) throw error;
        return { submission };
      }

      throw new Error('Unsupported Supabase request.');
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getLocalSubmissions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveLocalSubmission(sub) {
      const list = getLocalSubmissions();
      list.unshift(sub);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function switchView(view) {
      if (currentView === 'exam' && view !== 'submitted') {
        if (!confirm("Are you sure you want to leave the ongoing exam?")) return;
        clearInterval(timerInterval);
      }
      if (currentView === 'admin_dashboard' && view !== 'admin_dashboard') {
        supabaseClient?.auth.signOut();
        submissionsCache = [];
      }
      currentView = view;
      render();
    }

    function startExam(e) {
      e.preventDefault();
      const nameInput = document.getElementById('studentName').value.trim();
      const rollInput = document.getElementById('studentRoll').value.trim();
      if (!nameInput) {
        alert("Kripya apna Username / Full Name darj karein!");
        return;
      }
      studentName = nameInput;
      studentRoll = rollInput || 'N/A';

      // Ulat-Palat (Shuffle Questions and Shuffle Options)
      const qShuffled = shuffleArray(RAW_QUESTIONS).map((item, idx) => ({
        ...item,
        displayNumber: idx + 1,
        shuffledOptions: shuffleArray(item.options)
      }));

      shuffledQuestions = qShuffled;
      currentIdx = 0;
      responses = {};
      markedReview = {};
      timeLeft = 7200;

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById('timer-display');
        if (timerEl) timerEl.textContent = formatTime(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitExam(true);
        }
      }, 1000);

      currentView = 'exam';
      render();
    }

    function selectAnswer(qId, val) {
      responses[qId] = val;
      renderExamContent();
    }

    function clearAnswer(qId) {
      delete responses[qId];
      renderExamContent();
    }

    function toggleReview(qId) {
      markedReview[qId] = !markedReview[qId];
      renderExamContent();
    }

    function goToQuestion(idx) {
      currentIdx = idx;
      renderExamContent();
    }

    async function submitExam(auto = false) {
      if (!auto) {
        const answeredCount = Object.keys(responses).length;
        if (!confirm(`Aapne ${RAW_QUESTIONS.length} me se ${answeredCount} sawal hal kiye hain. Kya aap final test submit karna chahte hain?`)) {
          return;
        }
      }
      clearInterval(timerInterval);

      let correct = 0, wrong = 0, unattempted = 0;
      const details = RAW_QUESTIONS.map(q => {
        const picked = responses[q.id] || null;
        const isCorrect = picked === q.ans;
        if (picked === null) unattempted++;
        else if (isCorrect) correct++;
        else wrong++;
        return { id: q.id, section: q.section, q: q.q, chosen: picked, correctAns: q.ans, isCorrect };
      });

      const record = {
        id: 'SUB-' + Date.now(),
        username: studentName,
        rollNo: studentRoll,
        submittedAt: new Date().toLocaleString(),
        timeTaken: formatTime(7200 - timeLeft),
        totalQuestions: RAW_QUESTIONS.length,
        attempted: correct + wrong,
        correct,
        wrong,
        unattempted,
        percentage: ((correct / RAW_QUESTIONS.length) * 100).toFixed(2),
        details
      };

      try {
        const result = await apiRequest('/api/submissions', {
          method: 'POST',
          body: JSON.stringify(record),
        });
        latestSubmission = result.submission;
        latestSubmissionIsSynced = true;
      } catch (error) {
        latestSubmission = record;
        latestSubmissionIsSynced = false;
        saveLocalSubmission(record);
        alert(`Response server par save nahi ho saka: ${error.message}. Yeh result filhal isi device par backup hua hai; internet/API theek hone par admin login se sync karein.`);
      }
      currentView = 'submitted';
      render();
    }

    async function checkAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value;
      try {
        const login = await apiRequest('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ email, password: pass }),
        });
        const localRecords = getLocalSubmissions();
        if (localRecords.length) {
          await apiRequest('/api/admin/migrate', {
            method: 'POST',
            body: JSON.stringify({ submissions: localRecords }),
          });
          localStorage.removeItem(STORAGE_KEY);
        }

        const result = await apiRequest('/api/admin/submissions');
        submissionsCache = result.submissions;
        currentView = 'admin_dashboard';
        render();
      } catch (error) {
        alert(error.message.includes('Invalid login credentials')
          ? 'Admin email ya password galat hai.'
          : `Admin results load nahi ho paye: ${error.message}`);
      }
    }

    async function deleteSubmission(id) {
      if (!confirm("Kya aap is student ka record delete karna chahte hain?")) return;
      try {
        await apiRequest(`/api/admin/submissions/${encodeURIComponent(id)}`, { method: 'DELETE' });
        submissionsCache = submissionsCache.filter(s => s.id !== id);
        if (selectedSubmissionId === id) selectedSubmissionId = null;
        render();
      } catch (error) {
        alert(`Record delete nahi ho saka: ${error.message}`);
      }
    }

    function exportCSV() {
      const subs = submissionsCache;
      if (!subs.length) return alert("Koi record nahi mila!");
      const headers = ["Username", "Roll No", `Score (Out of ${RAW_QUESTIONS.length})`, "Percentage", "Attempted", "Correct", "Wrong", "Unattempted", "Time Taken", "Submitted At"];
      const rows = subs.map(s => [
        `"${s.username}"`, `"${s.rollNo}"`, s.correct, `${s.percentage}%`,
        s.attempted, s.correct, s.wrong, s.unattempted, `"${s.timeTaken}"`, `"${s.submittedAt}"`
      ]);
      const csv = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
      const link = document.createElement("a");
      link.href = encodeURI(csv);
      link.download = `AMU_Class6_Results_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-96 overflow-y-auto pr-1">
                  ${activeSub.details.map(d => `
                    <div class="p-3 rounded-xl border text-xs ${d.chosen === null ? 'bg-slate-50 border-slate-200' : d.isCorrect ? 'bg-emerald-50/60 border-emerald-200' : 'bg-rose-50/60 border-rose-200'}">
                      <p class="font-bold text-slate-800 mb-1">Q#${d.id} (${escapeHtml(d.section)}): ${escapeHtml(d.q)}</p>
                      <p>Student Answer: <strong>${escapeHtml(d.chosen || 'Not Attempted')}</strong></p>
                      <p class="text-emerald-800">Correct Answer: <strong>${escapeHtml(d.correctAns)}</strong></p>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }
    }

    // Initial Render
    render();
  </script>
</body>
</html>
