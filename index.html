    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    async function apiRequest(url, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      const token = sessionStorage.getItem(ADMIN_TOKEN_KEY);
      if (token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(url, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
      return data;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getLocalSubmissions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveLocalSubmission(sub) {
      const list = getLocalSubmissions();
      list.unshift(sub);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function switchView(view) {
      if (currentView === 'exam' && view !== 'submitted') {
        if (!confirm("Are you sure you want to leave the ongoing exam?")) return;
        clearInterval(timerInterval);

      if (currentView === 'admin_dashboard' && view !== 'admin_dashboard') {
        sessionStorage.removeItem(ADMIN_TOKEN_KEY);
        submissionsCache = [];
      }
      currentView = view;
      render();
    }

      }
      studentName = nameInput;
      studentRoll = rollInput || 'N/A';

      // Ulat-Palat (Shuffle Questions and Shuffle Options)
      const qShuffled = shuffleArray(RAW_QUESTIONS).map((item, idx) => ({
        ...item,
        displayNumber: idx + 1,
        shuffledOptions: shuffleArray(item.options)
      }));

      shuffledQuestions = qShuffled;
      currentIdx = 0;
      responses = {};
      markedReview = {};
      timeLeft = 7200;

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById('timer-display');
        if (timerEl) timerEl.textContent = formatTime(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitExam(true);
        }
      }, 1000);

      currentView = 'exam';
      render();
    }

    function selectAnswer(qId, val) {
      responses[qId] = val;
      renderExamContent();
    }

    function clearAnswer(qId) {
      delete responses[qId];
      renderExamContent();
    }

    function toggleReview(qId) {
      markedReview[qId] = !markedReview[qId];
      renderExamContent();
    }

    function goToQuestion(idx) {
      currentIdx = idx;
      renderExamContent();
    }

    async function submitExam(auto = false) {
      if (!auto) {
        const answeredCount = Object.keys(responses).length;
        if (!confirm(`Aapne 85 me se ${answeredCount} sawal hal kiye hain. Kya aap final test submit karna chahte hain?`)) {
          return;
        }
      }
      clearInterval(timerInterval);

      let correct = 0, wrong = 0, unattempted = 0;
      const details = RAW_QUESTIONS.map(q => {
        const picked = responses[q.id] || null;
        const isCorrect = picked === q.ans;
        if (picked === null) unattempted++;
        else if (isCorrect) correct++;
        else wrong++;
        return { id: q.id, section: q.section, q: q.q, chosen: picked, correctAns: q.ans, isCorrect };
      });

      const record = {
        id: 'SUB-' + Date.now(),
        username: studentName,
        rollNo: studentRoll,
        submittedAt: new Date().toLocaleString(),
        timeTaken: formatTime(7200 - timeLeft),
        totalQuestions: RAW_QUESTIONS.length,
        attempted: correct + wrong,
        correct,
        wrong,
        unattempted,
        percentage: ((correct / RAW_QUESTIONS.length) * 100).toFixed(2),
        details
      };

      try {
        const result = await apiRequest('/api/submissions', {
          method: 'POST',
          body: JSON.stringify(record),
        });
        latestSubmission = result.submission;
        latestSubmissionIsSynced = true;
      } catch (error) {
        latestSubmission = record;
        latestSubmissionIsSynced = false;
        saveLocalSubmission(record);
        alert(`Response server par save nahi ho saka: ${error.message}. Yeh result filhal isi device par backup hua hai; internet/API theek hone par admin login se sync karein.`);
      }
      currentView = 'submitted';
      render();
    }

    async function checkAdminLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('adminPass').value.trim();
      try {
        const login = await apiRequest('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ password: pass }),
        });
        sessionStorage.setItem(ADMIN_TOKEN_KEY, login.token);

        const localRecords = getLocalSubmissions();
        if (localRecords.length) {
          await apiRequest('/api/admin/migrate', {
            method: 'POST',
            body: JSON.stringify({ submissions: localRecords }),
          });
          localStorage.removeItem(STORAGE_KEY);
        }

        const result = await apiRequest('/api/admin/submissions');
        submissionsCache = result.submissions;
        currentView = 'admin_dashboard';
        render();
      } catch (error) {
        sessionStorage.removeItem(ADMIN_TOKEN_KEY);
        alert(error.message.includes('Incorrect') ? 'Galat passcode!' : `Admin results load nahi ho paye: ${error.message}`);
      }
    }

    async function deleteSubmission(id) {
      if (!confirm("Kya aap is student ka record delete karna chahte hain?")) return;
      try {
        await apiRequest(`/api/admin/submissions/${encodeURIComponent(id)}`, { method: 'DELETE' });
        submissionsCache = submissionsCache.filter(s => s.id !== id);
        if (selectedSubmissionId === id) selectedSubmissionId = null;
        render();
      } catch (error) {
        alert(`Record delete nahi ho saka: ${error.message}`);
      }
    }

    function exportCSV() {
      const subs = submissionsCache;
      if (!subs.length) return alert("Koi record nahi mila!");
      const headers = ["Username", "Roll No", "Score (Out of 85)", "Percentage", "Attempted", "Correct", "Wrong", "Unattempted", "Time Taken", "Submitted At"];
      const rows = subs.map(s => [
        `"${s.username}"`, `"${s.rollNo}"`, s.correct, `${s.percentage}%`,
        s.attempted, s.correct, s.wrong, s.unattempted, `"${s.timeTaken}"`, `"${s.submittedAt}"`
      ]);
      const csv = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
      const link = document.createElement("a");
      link.href = encodeURI(csv);
      link.download = `AMU_Class6_Results_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function renderExamContent() {
      const q = shuffledQuestions[currentIdx];
      const answeredCount = Object.keys(responses).length;
      const chosen = responses[q.id];

      const mainCard = document.getElementById('exam-question-card');
      const paletteCard = document.getElementById('exam-palette-grid');
      const progressText = document.getElementById('exam-progress-text');

      if (progressText) progressText.textContent = `${answeredCount} / 85 Attempted`;

      if (mainCard) {
        mainCard.innerHTML = `
          <div class="bg-slate-50 px-6 py-3.5 border-b border-slate-200 flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="bg-emerald-900 text-white text-xs font-bold px-2.5 py-1 rounded-md">
                Question ${currentIdx + 1} of 85
              </span>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-amber-100 text-amber-900 border border-amber-200">
                ${q.section}
              </span>
            </div>
            <span class="text-xs text-slate-400 font-mono">Paper Set Code: #${q.id}</span>
          </div>

          <div class="p-6 sm:p-8 flex-1 flex flex-col justify-between">
            <div>
              <p class="text-lg sm:text-xl font-semibold text-slate-800 mb-6 select-none ${q.isRTL ? 'urdu-text text-2xl' : ''}">
                ${q.q}
              </p>
              <div class="space-y-3">
                ${q.shuffledOptions.map((opt, idx) => {
                  const label = String.fromCharCode(65 + idx);
                  const isSelected = chosen === opt;
                  return `
                    <button onclick="selectAnswer(${q.id}, '${opt.replace(/'/g, "\'")}')"
                      class="w-full text-left p-4 rounded-xl border-2 transition flex items-center justify-between ${
                        isSelected ? 'border-emerald-600 bg-emerald-50/80 text-emerald-950 font-semibold shadow-sm' : 'border-slate-200 hover:border-emerald-300 hover:bg-slate-50 text-slate-700'
                      }">
                      <div class="flex items-center space-x-3.5 w-full ${q.isRTL ? 'flex-row-reverse space-x-reverse' : ''}">
                        <span class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold shrink-0 ${
                          isSelected ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'
                        }">${label}</span>
                        <span class="text-base ${q.isRTL ? 'urdu-text text-xl w-full' : ''}">${opt}</span>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="pt-6 mt-8 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center space-x-2">
                <button onclick="toggleReview(${q.id})" class="px-3.5 py-2 rounded-lg text-xs font-semibold border transition ${
                  markedReview[q.id] ? 'bg-amber-100 border-amber-400 text-amber-900' : 'border-slate-300 text-slate-600 hover:bg-slate-100'
                }">
                  ${markedReview[q.id] ? '★ Marked for Review' : '☆ Mark for Review'}
                </button>
                ${chosen ? `<button onclick="clearAnswer(${q.id})" class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-rose-200 text-rose-600 hover:bg-rose-50 transition">Clear</button>` : ''}
              </div>

              <div class="flex items-center space-x-2">
                <button onclick="goToQuestion(${Math.max(0, currentIdx - 1)})" ${currentIdx === 0 ? 'disabled' : ''}
                  class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-300 text-slate-700 hover:bg-slate-100 disabled:opacity-40">
                  ← Previous
                </button>
                ${currentIdx < 84 ? `
                  <button onclick="goToQuestion(${currentIdx + 1})" class="px-5 py-2 rounded-lg text-sm font-semibold bg-emerald-700 hover:bg-emerald-800 text-white shadow-sm">
                    Save & Next →
                  </button>
                ` : `
                  <button onclick="submitExam(false)" class="px-5 py-2 rounded-lg text-sm font-bold bg-rose-600 hover:bg-rose-700 text-white shadow-sm">
                    Final Submit ✔
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }

      if (paletteCard) {
        paletteCard.innerHTML = shuffledQuestions.map((item, idx) => {
          const isAns = responses[item.id] !== undefined;
          const isRev = markedReview[item.id];
          const isCur = idx === currentIdx;
          let cls = 'bg-slate-100 text-slate-600 hover:bg-slate-200';
          if (isRev) cls = 'bg-amber-400 text-amber-950';
          else if (isAns) cls = 'bg-emerald-600 text-white';
          if (isCur) cls += ' ring-2 ring-emerald-900 ring-offset-1';
          return `<button onclick="goToQuestion(${idx})" class="h-8 rounded-lg text-xs font-bold transition ${cls}">${idx + 1}</button>`;
        }).join('');
      }
    }

    function render() {
      const container = document.getElementById('app-container');

      if (currentView === 'landing') {
        container.innerHTML = `
          <div class="max-w-xl mx-auto mt-6 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-900 px-6 py-6 text-white">
              <span class="bg-amber-400/20 text-amber-300 border border-amber-400/30 text-xs font-semibold px-2.5 py-1 rounded-full">
                2025 Official Question Bank (85 Questions)
              </span>
              <h2 class="text-2xl font-bold mt-2">AMU Class-6 Entrance Mock Test</h2>
              <p class="text-emerald-100 text-sm mt-1">Har student ke liye sawal aur options ulat-palat (auto-shuffle) ho jayenge.</p>
            </div>

            <form onsubmit="startExam(event)" class="p-6 space-y-5">
              <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-900 space-y-1">
                <p class="font-bold text-sm">📌 Test Rules:</p>
                <p>• Kul <strong>85 Questions</strong> hain (English, Hindi, Urdu, Maths, Science/EVS).</p>
                <p>• Sahi jawab ke <strong>+1 mark</strong> hain, koi negative marking nahi hai.</p>
                <p>• Test submit karne ke baad <strong>student ko score nahi dikhega</strong>. Score sirf <strong>Admin Panel</strong> me dikhega.</p>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Student Username / Full Name *</label>
                <input id="studentName" type="text" required placeholder="Apna naam likhein (e.g. Asif Eqbal)"
                  class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-600 outline-none text-sm font-medium"/>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Roll Number / ID (Optional)</label>
                <input id="studentRoll" type="text" placeholder="Apna Roll No. darj karein"
                  class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-600 outline-none text-sm font-medium"/>
              </div>

              <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl shadow-md transition text-base">
                Start Shuffled Test (85 Questions) →
              </button>
            </form>
          </div>
        `;
      }

      else if (currentView === 'exam') {
        container.innerHTML = `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3.5 mb-5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
              <span class="bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-lg text-sm">👤 ${studentName}</span>
              <span id="exam-progress-text" class="text-xs font-semibold text-slate-500">0 / 85 Attempted</span>
            </div>
            <div class="flex items-center space-x-4">
              <div class="bg-slate-100 px-3.5 py-1.5 rounded-lg border border-slate-200 font-mono font-bold text-sm text-slate-800">
                ⏱ <span id="timer-display">${formatTime(timeLeft)}</span>
              </div>
              <button onclick="submitExam(false)" class="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-4 py-2 rounded-lg text-sm shadow-sm transition">
                Submit Test
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div id="exam-question-card" class="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col min-h-[430px]"></div>
            <div class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
              <h3 class="font-bold text-slate-800 text-sm mb-3">Question Palette (Shuffled)</h3>
              <div id="exam-palette-grid" class="grid grid-cols-7 gap-1.5 max-h-80 overflow-y-auto pr-1"></div>
              <div class="mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500 space-y-1">
                <div><span class="inline-block w-3 h-3 bg-emerald-600 rounded mr-1.5"></span>Answered</div>
                <div><span class="inline-block w-3 h-3 bg-amber-400 rounded mr-1.5"></span>Marked for Review</div>
                <div><span class="inline-block w-3 h-3 bg-slate-200 rounded mr-1.5"></span>Not Attempted</div>
              </div>
            </div>
          </div>
        `;
        renderExamContent();
      }

      else if (currentView === 'submitted') {
        const latest = latestSubmission || {};
        container.innerHTML = `
          <div class="max-w-lg mx-auto mt-10 bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">✔</div>
            <h2 class="text-2xl font-bold text-slate-800">Test Submitted Successfully!</h2>
            <p class="text-slate-600 text-sm mt-2">
              Dhanyawad <span class="font-bold text-slate-900">${escapeHtml(studentName)}</span>! ${latestSubmissionIsSynced ? 'Aapka response shared server par save ho gaya hai.' : 'Response server par sync nahi hua; admin ko abhi yeh result nahi dikhega.'}
            </p>
            <div class="bg-slate-50 rounded-xl p-4 my-6 border border-slate-200 text-left text-sm space-y-2">
              <div class="flex justify-between"><span class="text-slate-500">Username:</span><span class="font-bold">${escapeHtml(studentName)}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Questions Attempted:</span><span class="font-bold text-emerald-700">${latest.attempted || 0} / 85</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Result Status:</span><span class="font-semibold text-amber-700">🔒 Restricted to Admin Only</span></div>

            <button onclick="switchView('landing')" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition">
              Back to Home (Next Student)
            </button>
          </div>
        `;
      }

      else if (currentView === 'admin_login') {
        container.innerHTML = `
          <div class="max-w-md mx-auto mt-12 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 px-6 py-5 text-white">
              <h2 class="text-lg font-bold">🔒 Admin Login</h2>
              <p class="text-xs text-slate-400">Sirf Admin hi students ka score aur username dekh sakte hain</p>
            </div>
            <form onsubmit="checkAdminLogin(event)" class="p-6 space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">Admin Passcode</label>
                <input id="adminPass" type="password" required placeholder="Enter admin passcode"
                  class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-600 outline-none text-sm"/>
              </div>
              <div class="flex space-x-2">
                <button type="button" onclick="switchView('landing')" class="w-1/3 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold text-slate-600">Cancel</button>
                <button type="submit" class="w-2/3 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-bold">Unlock Results</button>
              </div>
            </form>
          </div>
        `;
      }

      else if (currentView === 'admin_dashboard') {
        const subs = submissionsCache;
        const activeSub = subs.find(s => s.id === selectedSubmissionId) || null;
        container.innerHTML = `
          <div class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 class="text-xl font-bold text-slate-800">Admin Results Dashboard</h2>

              <div class="flex items-center space-x-2">
                <button onclick="exportCSV()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl">⬇ Export CSV (Excel)</button>
                <button onclick="switchView('landing')" class="border border-slate-300 text-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl">Logout</button>
              </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-100 text-slate-600 text-xs uppercase">
                      <th class="py-3.5 px-4">Username</th>
                      <th class="py-3.5 px-4">Roll No</th>
                      <th class="py-3.5 px-4">Score (85)</th>
                      <th class="py-3.5 px-4">Percentage</th>
                      <th class="py-3.5 px-4">Correct / Wrong</th>
                      <th class="py-3.5 px-4">Submitted At</th>
                      <th class="py-3.5 px-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200 text-sm">
                    ${subs.length === 0 ? `<tr><td colspan="7" class="py-8 text-center text-slate-400">Abhi tak kisi student ne test submit nahi kiya hai.</td></tr>` :
                      subs.map(s => `
                        <tr class="hover:bg-slate-50">
                          <td class="py-3.5 px-4 font-bold text-slate-900">${escapeHtml(s.username)}</td>
                          <td class="py-3.5 px-4 text-slate-600">${escapeHtml(s.rollNo)}</td>
                          <td class="py-3.5 px-4"><span class="bg-emerald-100 text-emerald-900 font-extrabold px-2.5 py-1 rounded-lg">${s.correct} / 85</span></td>
                          <td class="py-3.5 px-4 font-semibold">${s.percentage}%</td>
                          <td class="py-3.5 px-4 text-xs"><span class="text-emerald-700 font-bold">✔ ${s.correct}</span> • <span class="text-rose-600 font-bold">✖ ${s.wrong}</span></td>
                          <td class="py-3.5 px-4 text-xs text-slate-500">${escapeHtml(s.submittedAt)}</td>
                          <td class="py-3.5 px-4 text-right space-x-2">
                            <button onclick="selectedSubmissionId='${s.id}'; render();" class="text-xs font-bold text-emerald-700 underline">View Sheet</button>
                            <button onclick="deleteSubmission('${s.id}')" class="text-xs font-bold text-rose-600 underline">Delete</button>
                          </td>
                        </tr>
                      `).join('')
                    }
                  </tbody>
                </table>
              </div>
            </div>

            ${activeSub ? `
              <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-200">
                  <div>
                    <h3 class="font-bold text-lg text-slate-800">${escapeHtml(activeSub.username)} ki Answer Sheet (Score: ${activeSub.correct}/85)</h3>
                    <p class="text-xs text-slate-500">Roll No: ${escapeHtml(activeSub.rollNo)} • Time Taken: ${escapeHtml(activeSub.timeTaken)}</p>
                  </div>
                  <button onclick="selectedSubmissionId=null; render();" class="text-xs font-bold text-slate-500 border px-3 py-1.5 rounded-lg">Close ✖</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-96 overflow-y-auto pr-1">
                  ${activeSub.details.map(d => `
                    <div class="p-3 rounded-xl border text-xs ${d.chosen === null ? 'bg-slate-50 border-slate-200' : d.isCorrect ? 'bg-emerald-50/60 border-emerald-200' : 'bg-rose-50/60 border-rose-200'}">
                      <p class="font-bold text-slate-800 mb-1">Q#${d.id} (${escapeHtml(d.section)}): ${escapeHtml(d.q)}</p>
                      <p>Student Answer: <strong>${escapeHtml(d.chosen || 'Not Attempted')}</strong></p>
                      <p class="text-emerald-800">Correct Answer: <strong>${escapeHtml(d.correctAns)}</strong></p>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }
    }

    // Initial Render
    render();
  </script>
</body>
</html>
